<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">90 Minute Cycles TradingView Indicator Architecture</title>
<desc id="desc">Sanitized OSYSTIC architecture showing time model, cycle engine, source tracking, market levels, and display layer.</desc>
<style>
  .bg{fill:#0d1117}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.box2{fill:#161b22;stroke:#3fb950;stroke-width:2}
  .box3{fill:#161b22;stroke:#d29922;stroke-width:2}.txt{fill:#f0f6fc;font-family:Arial,sans-serif;font-size:22px}
  .small{fill:#c9d1d9;font-family:Arial,sans-serif;font-size:17px}.line{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs>
<rect class="bg" width="1200" height="700"/>
<text x="600" y="55" text-anchor="middle" class="txt">OSYSTIC · TradingView Multi-Timeframe Indicator</text>
<rect class="box" x="420" y="90" rx="16" width="360" height="90"/>
<text x="600" y="125" text-anchor="middle" class="txt">New York Time Model</text>
<text x="600" y="155" text-anchor="middle" class="small">sessions + calendar boundaries</text>
<path class="line" d="M600 180 L600 230"/>
<rect class="box2" x="100" y="230" rx="16" width="280" height="120"/>
<text x="240" y="270" text-anchor="middle" class="txt">Cycle Engine</text>
<text x="240" y="305" text-anchor="middle" class="small">Session · M90 · M30 · M10</text>
<text x="240" y="330" text-anchor="middle" class="small">progressive live geometry</text>
<rect class="box2" x="460" y="230" rx="16" width="280" height="120"/>
<text x="600" y="270" text-anchor="middle" class="txt">Source Tracking</text>
<text x="600" y="305" text-anchor="middle" class="small">exact H/L candle anchors</text>
<text x="600" y="330" text-anchor="middle" class="small">breaker lifecycle</text>
<rect class="box2" x="820" y="230" rx="16" width="280" height="120"/>
<text x="960" y="270" text-anchor="middle" class="txt">Market Levels</text>
<text x="960" y="305" text-anchor="middle" class="small">HTF / intraday opens</text>
<text x="960" y="330" text-anchor="middle" class="small">previous S/D/W/M/Y H/L</text>
<path class="line" d="M600 180 L240 230"/><path class="line" d="M600 180 L960 230"/>
<path class="line" d="M240 350 L430 455"/><path class="line" d="M600 350 L600 435"/><path class="line" d="M960 350 L770 455"/>
<rect class="box3" x="330" y="435" rx="16" width="540" height="120"/>
<text x="600" y="475" text-anchor="middle" class="txt">Display & Object State</text>
<text x="600" y="510" text-anchor="middle" class="small">boxes · lines · labels · bounded history</text>
<text x="600" y="535" text-anchor="middle" class="small">label hierarchy + configurable readability</text>
<path class="line" d="M600 555 L600 605"/>
<rect class="box" x="420" y="605" rx="16" width="360" height="65"/>
<text x="600" y="645" text-anchor="middle" class="txt">TradingView Overlay</text>
</svg>